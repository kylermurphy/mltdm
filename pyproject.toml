[build-system]
requires = [
"setuptools>=59.6",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["mltdm"]  # package names should match these glob patterns (["*"] by default)
exclude = ["Notebooks"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[project]
name = "mltdm"
version = "0.1.0"
description = "Random Forest Thermosphere Density Model"
authors = [
	{ name = "Kyle Murphy" },
	{ name = "Chris Bard" }
]
requires-python = ">=3.10,<4.0.0"
readme = "README.md"

classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Education",
"Intended Audience :: Science/Research",
"Programming Language :: Python",
"Operating System :: OS Independent",
"Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    'numpy>=1.24.2',
    'pandas>=2.2.2',
    'matplotlib>=3.7.1',
    'scikit-learn ==1.5.1',
    'skops ==0.11.0',
    'netCDF4 >=1.6.4',
    'ipywidgets >=8.1.3',
    'tqdm >=4.66.4',
    "requests>=2.33.1",
    "pyyaml>=6.0.0",
    "scipy>=1.10.0",
    "python-dateutil>=2.8.2",
    "cartopy>=0.25.0",
    "euvpy>=1.0.0"
]
